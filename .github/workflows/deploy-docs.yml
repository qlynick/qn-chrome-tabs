name: 部署文档站

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: 安装文档站依赖
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: 构建文档站
        working-directory: docs
        env:
          DOCS_PUBLIC_BASE: https://qlynick.github.io/qn-chrome-tabs/
        run: bun run build

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
