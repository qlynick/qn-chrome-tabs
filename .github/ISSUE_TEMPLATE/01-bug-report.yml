name: Bug report / Bug 报告 / 버그 신고
description: Report a reproducible problem / 报告可复现的问题 / 재현 가능한 문제 신고
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide a minimal reproduction when possible.

        感谢你报告问题，请尽量提供最小复现。

        문제를 신고해 주셔서 감사합니다. 가능하면 최소 재현 예제를 제공해 주세요.

        For security vulnerabilities, use the private reporting link in the issue chooser.

        安全漏洞请使用 Issue 选择器中的私密报告入口。

        보안 취약점은 Issue 선택 화면의 비공개 신고 링크를 이용해 주세요.
  - type: input
    id: version
    attributes:
      label: Package version / 包版本 / 패키지 버전
      description: Which version is affected? / 哪个版本受到影响？ / 어떤 버전에서 문제가 발생하나요?
      placeholder: 1.0.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 运行环境 / 실행 환경
      description: Browser, operating system, and framework / 浏览器、操作系统和框架 / 브라우저, 운영체제 및 프레임워크
      placeholder: Chrome 140, macOS 15, Vue 3
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Minimal reproduction / 最小复现 / 최소 재현
      description: StackBlitz, repository, or another runnable example / StackBlitz、仓库或其他可运行示例 / StackBlitz, 저장소 또는 실행 가능한 예제
      placeholder: https://stackblitz.com/...
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤 / 재현 단계
      description: List the smallest sequence that shows the problem / 列出能够稳定重现问题的最短步骤 / 문제를 재현하는 가장 짧은 단계를 적어 주세요
      placeholder: |
        1. Render the component / 渲染组件 / 컴포넌트 렌더링
        2. Click / 点击 / 클릭
        3. Observe / 观察结果 / 결과 확인
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为 / 예상 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为 / 실제 동작
      description: Add screenshots, recordings, or console output when useful / 可附上截图、录屏或控制台输出 / 필요한 경우 스크린샷, 녹화 또는 콘솔 출력을 첨부해 주세요
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 提交之前 / 제출 전 확인
      options:
        - label: I reproduced this with the latest release. / 我已使用最新版本复现。 / 최신 릴리스에서 재현했습니다.
          required: true
        - label: I searched existing issues. / 我已搜索现有 Issue。 / 기존 Issue를 검색했습니다.
          required: true
        - label: This is not a security vulnerability. / 这不是安全漏洞。 / 보안 취약점 신고가 아닙니다.
          required: true
